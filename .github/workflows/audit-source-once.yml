name: Verify pinned Git source tree plane
on:
  push:
    paths:
      - '.github/workflows/audit-source-once.yml'
permissions:
  contents: write
jobs:
  audit:
    uses: Anselm04/Macro-source-code-reference-/.github/workflows/reusable-source-audit.yml@main
    with:
      upstream_url: https://github.com/makeplane/plane.git
      upstream_sha: 290383d7f92fa8995ea2adbd12442220b3b9b525
      audit_slug: plane
